# Render Blueprint — máy chủ AI (FastAPI) của Socratic Vision Board.
# Dùng: Render Dashboard → New → Blueprint → chọn repo này. Chi tiết: socratic-monorepo/DEPLOY.md
services:
  - type: web
    name: socratic-ai-engine
    runtime: python
    # Singapore: gần Việt Nam nhất (độ trễ mỗi lời gọi thấp hơn hẳn so với Oregon/Frankfurt).
    region: singapore
    # free: ngủ sau 15 phút không có truy cập (xem DEPLOY.md mục "Giữ máy chủ luôn thức"). Muốn mượt như chạy cục bộ khi
    # trình chiếu/thi thì nâng lên gói trả phí (starter trở lên) để không bị ngủ.
    plan: free
    rootDir: socratic-monorepo/services/ai-engine
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeploy: true
    # Chỉ build lại khi mã máy chủ đổi (không build lại khi sửa tài liệu, video, giao diện).
    buildFilter:
      paths:
        - socratic-monorepo/services/ai-engine/**
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      # Địa chỉ giao diện được phép gọi thẳng máy chủ (trình duyệt gọi Render, không qua Vercel). Nhiều địa chỉ ngăn bằng dấu phẩy,
      # ví dụ: https://socratic-board.vercel.app,https://socratic-student.vercel.app. Không đặt = cho mọi nguồn (chỉ nên dùng khi thử).
      - key: CORS_ORIGINS
        sync: false
      # Địa chỉ xem trước của Vercel đổi theo từng nhánh/lần deploy; cho phép mọi tên miền *.vercel.app của bạn (siết lại nếu cần).
      - key: CORS_ORIGIN_REGEX
        value: ^https://.*\.vercel\.app$
      # Số lời gọi AI tốn khóa máy chủ cho phép mỗi phút trên mỗi địa chỉ IP (lời gọi dùng khóa riêng của người dùng không bị tính).
      - key: RATE_LIMIT_PER_MIN
        value: "90"
      # Khóa quản trị để ghi khóa AI qua API (mặc định tắt trên bản công khai). Render tự sinh giá trị ngẫu nhiên.
      - key: ADMIN_TOKEN
        generateValue: true
      # AI (Vision, hỏi đáp, gia sư): bể khóa Gemini trước, OpenRouter dự phòng. `openrouter` = chỉ OpenRouter, `gemini` = chỉ Gemini.
      - key: VISION_PROVIDER
        value: auto
      # Số lượt gọi tối đa mỗi phút cho MỖI khóa Gemini: đặt thấp hơn hạn mức thật để không chạm 429; hết lượt thì sang khóa khác rồi OpenRouter.
      - key: GEMINI_RPM_PER_KEY
        value: "8"
      # Khóa AI. Không ghi vào tệp: nhập tay trong Dashboard sau khi Blueprint tạo dịch vụ.
      # Nhiều khóa ngăn bằng dấu phẩy; mỗi khóa từ MỘT DỰ ÁN GOOGLE KHÁC NHAU (hạn mức tính theo dự án).
      - key: OPENROUTER_API_KEYS
        sync: false
      # Tùy chọn: ghi đè danh sách model Vision (ngăn bằng dấu phẩy, model đầu được thử trước).
      # Mặc định: google/gemini-2.5-flash, google/gemini-2.5-flash-lite, qwen/qwen3-vl-30b-a3b-instruct, openai/gpt-4o-mini, google/gemma-4-31b-it:free
      - key: OPENROUTER_VISION_MODELS
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
