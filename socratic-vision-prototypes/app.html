<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socratic Vision Board - Unified Product</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: white; margin: 0; overflow: hidden; }
        .sidebar { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border-right: 1px solid rgba(255,255,255,0.05); }
        .nav-item { transition: all 0.2s; border-left: 3px solid transparent; }
        .nav-item:hover { background: rgba(255,255,255,0.05); }
        .nav-item.active { background: rgba(139, 92, 246, 0.1); border-left-color: #a855f7; color: white; }
        iframe { width: 100%; height: 100%; border: none; background: #020617; }
    </style>
</head>
<body class="flex h-screen w-screen">

    <!-- Sidebar Menu -->
    <div class="sidebar w-64 h-full flex flex-col z-10 shadow-2xl shrink-0">
        <div class="p-6 border-b border-white/5">
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-fuchsia-400 to-cyan-400">Socratic Vision</h1>
            <p class="text-xs text-slate-500 mt-1 uppercase tracking-wider">Enterprise EdTech</p>
        </div>

        <div class="flex-1 overflow-y-auto py-4 flex flex-col gap-1">
            <div class="px-6 pb-2 text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-2">Giáo viên (Teacher)</div>
            
            <button class="nav-item active flex items-center gap-3 px-6 py-3 text-sm text-slate-400 text-left w-full" onclick="loadFeature('feature1_smart_canvas.html', this)">
                <i data-lucide="pen-tool" class="w-4 h-4"></i> Smart Canvas
            </button>
            <button class="nav-item flex items-center gap-3 px-6 py-3 text-sm text-slate-400 text-left w-full" onclick="loadFeature('smartboard_ui_final.html', this)">
                <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Radial UI & Reach
            </button>
            <button class="nav-item flex items-center gap-3 px-6 py-3 text-sm text-slate-400 text-left w-full" onclick="loadFeature('smartboard_error_correction.html', this)">
                <i data-lucide="keyboard-off" class="w-4 h-4"></i> Zero-Keyboard
            </button>
            <button class="nav-item flex items-center gap-3 px-6 py-3 text-sm text-slate-400 text-left w-full" onclick="loadFeature('smartboard_socratic_flow.html', this)">
                <i data-lucide="wind" class="w-4 h-4"></i> Socratic Flow
            </button>

            <div class="px-6 pb-2 text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-6">Học sinh (Student)</div>
            
            <button class="nav-item flex items-center gap-3 px-6 py-3 text-sm text-slate-400 text-left w-full" onclick="loadFeature('smartboard_sandbox_student.html', this)">
                <i data-lucide="flask-conical" class="w-4 h-4"></i> Foolproof Sandbox
            </button>
            <button class="nav-item flex items-center gap-3 px-6 py-3 text-sm text-slate-400 text-left w-full" onclick="loadFeature('feature6_student_friction_app.html', this)">
                <i data-lucide="lock" class="w-4 h-4"></i> Cognitive Friction UI
            </button>
            <button class="nav-item flex items-center gap-3 px-6 py-3 text-sm text-slate-400 text-left w-full" onclick="loadFeature('feature6_gamified_dashboard.html', this)">
                <i data-lucide="gamepad-2" class="w-4 h-4"></i> Grit Economy
            </button>

            <div class="px-6 pb-2 text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-6">Hệ thống (System)</div>
            
            <button class="nav-item flex items-center gap-3 px-6 py-3 text-sm text-slate-400 text-left w-full" onclick="loadFeature('feature5_dual_dashboards.html', this)">
                <i data-lucide="bar-chart-3" class="w-4 h-4"></i> Dual Analytics
            </button>
            <button class="nav-item flex items-center gap-3 px-6 py-3 text-sm text-slate-400 text-left w-full" onclick="loadFeature('design_system_showcase.html', this)">
                <i data-lucide="palette" class="w-4 h-4"></i> Design Manifesto
            </button>
        </div>

        <div class="p-4 border-t border-white/5">
            <div class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs px-3 py-2 rounded-lg flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                System Online
            </div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 relative">
        <!-- Nút gạt Toggle Theme (Giả lập) -->
        <div class="absolute top-4 right-4 z-20 flex gap-2">
            <span class="bg-black/50 backdrop-blur text-xs text-slate-300 px-3 py-1.5 rounded-full border border-white/10 shadow-lg">Đang chạy phiên bản Unified SPA</span>
        </div>
        
        <iframe id="mainViewer" src="feature1_smart_canvas.html"></iframe>
    </div>

    <script>
        lucide.createIcons();

        function loadFeature(htmlFile, btnElement) {
            // Đổi iFrame
            document.getElementById('mainViewer').src = htmlFile;
            
            // Đổi trạng thái Active
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.classList.remove('active');
                btn.classList.replace('text-white', 'text-slate-400');
            });
            btnElement.classList.add('active');
            btnElement.classList.replace('text-slate-400', 'text-white');
        }
    </script>
</body>
</html>
