<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socratic Smart Canvas - World Class Edge AI</title>
    
    <!-- Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- MathJax for Math Rendering -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body {
            background-color: #020617; /* Slate 950 */
            font-family: 'Inter', sans-serif;
            color: white;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.1), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.1), transparent 40%);
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Khung kính ảo (Glassmorphism) cực cao cấp */
        .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 32px;
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.2),
                0 25px 50px -12px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        /* Lưới không gian (Dot pattern) */
        .canvas-grid {
            background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Bioluminescent Button */
        .ai-button {
            position: relative;
            background: linear-gradient(135deg, #a855f7, #0ea5e9);
            border-radius: 100px;
            padding: 12px 28px;
            font-weight: 600;
            color: white;
            border: none;
            cursor: pointer;
            z-index: 1;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .ai-button::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(135deg, #c084fc, #38bdf8);
            border-radius: 100px; z-index: -1;
            filter: blur(12px); opacity: 0;
            transition: opacity 0.3s ease;
        }

        .ai-button:hover::before { opacity: 0.8; }
        .ai-button:active { transform: scale(0.95); }

        /* Scanner Animation */
        .scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, transparent, #22d3ee, transparent);
            box-shadow: 0 0 20px 5px rgba(34, 211, 238, 0.5);
            transform: translateY(-100%);
            z-index: 20;
            display: none;
        }

        @keyframes scan {
            0% { transform: translateY(-10px); }
            100% { transform: translateY(600px); }
        }
        
        .scanning .scan-line {
            display: block;
            animation: scan 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        
        .scanning canvas {
            filter: blur(1px);
            transition: filter 0.3s;
        }

        /* SVG Graph Morphing Box */
        .result-box {
            opacity: 0; transform: translateY(20px); transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .result-box.active { opacity: 1; transform: translateY(0); }

        /* Tools */
        .tool-btn {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            color: #94a3b8; transition: all 0.2s;
        }
        .tool-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        .tool-btn.active { background: rgba(255,255,255,0.15); color: white; border-color: rgba(255,255,255,0.3); }

    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-8">

    <div class="max-w-7xl w-full grid grid-cols-1 lg:grid-cols-12 gap-8 relative">
        
        <!-- Cột trái: Canvas -->
        <div class="lg:col-span-8 flex flex-col h-[700px]">
            <div class="flex justify-between items-end mb-4 px-2">
                <div>
                    <h1 class="text-2xl font-bold text-white mb-1 tracking-tight">Smart Canvas</h1>
                    <p class="text-slate-400 text-sm">Viết phương trình bằng tay (OCR AI Edge) và xem Python Backend vẽ đồ thị.</p>
                </div>
                <!-- Tools -->
                <div class="flex gap-2 p-1.5 bg-slate-800/50 backdrop-blur-md rounded-2xl border border-white/5">
                    <button class="tool-btn active w-10 h-10 rounded-xl flex items-center justify-center" onclick="setTool('draw')"><i data-lucide="pen-tool" class="w-5 h-5"></i></button>
                    <button class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center" onclick="clearCanvas()"><i data-lucide="eraser" class="w-5 h-5"></i></button>
                </div>
            </div>

            <!-- Khung vẽ -->
            <div class="glass-panel flex-1 relative" id="canvasWrapper">
                <div class="scan-line"></div>
                <canvas id="smartBoard" class="w-full h-full canvas-grid cursor-crosshair touch-none"></canvas>
                
                <!-- Nút Quét nổi (Floating Action) -->
                <div class="absolute bottom-6 right-6">
                    <button class="ai-button flex items-center gap-2 shadow-2xl" onclick="triggerPythonAI()">
                        <i data-lucide="wand-2" class="w-5 h-5"></i>
                        <span>Render bằng Python</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Cột phải: Kết quả từ AI & Python Backend -->
        <div class="lg:col-span-4 flex flex-col h-[700px] pt-14">
            <div class="glass-panel h-full p-6 flex flex-col relative overflow-hidden" id="aiResultPanel">
                
                <!-- Trạng thái chờ -->
                <div class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 transition-opacity duration-300" id="emptyState">
                    <i data-lucide="brain-circuit" class="w-16 h-16 mb-4 opacity-50"></i>
                    <p class="text-sm font-medium">Chờ AI nhận diện và Python xử lý...</p>
                </div>

                <!-- Kết quả -->
                <div class="result-box h-full flex flex-col" id="resultContent">
                    <div class="flex items-center gap-2 text-cyan-400 text-sm font-bold tracking-wider uppercase mb-6">
                        <i data-lucide="server" class="w-4 h-4"></i> Python AI Backend 
                    </div>

                    <!-- 1. OCR Result (LaTeX) -->
                    <div class="mb-8">
                        <p class="text-xs text-slate-400 mb-2 font-medium">TOÁN HỌC NHẬN DIỆN (OCR):</p>
                        <div class="bg-slate-900/80 rounded-xl p-4 border border-white/5 shadow-inner">
                            <div id="mathOutput" class="text-2xl text-center text-slate-200">
                                <!-- MathJax injected here -->
                            </div>
                        </div>
                    </div>

                    <!-- 2. Python Matplotlib Graph (Simulated SVG) -->
                    <div class="flex-1 flex flex-col">
                        <p class="text-xs text-slate-400 mb-2 font-medium">MATPLOTLIB GRAPH (NEON STYLE):</p>
                        <div class="flex-1 bg-slate-900/80 rounded-xl border border-white/5 shadow-inner flex items-center justify-center overflow-hidden relative group">
                            <!-- SVG Code Mô phỏng kết quả của graph_engine.py -->
                            <svg viewBox="0 0 400 300" class="w-full h-full p-4 drop-shadow-[0_0_15px_rgba(34,211,238,0.4)]">
                                <!-- Grid -->
                                <path d="M50 0 v300 M100 0 v300 M150 0 v300 M200 0 v300 M250 0 v300 M300 0 v300 M350 0 v300" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
                                <path d="M0 50 h400 M0 100 h400 M0 150 h400 M0 200 h400 M0 250 h400" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
                                <!-- Axes -->
                                <path d="M0 150 H400" stroke="#334155" stroke-width="2"/>
                                <path d="M200 0 V300" stroke="#334155" stroke-width="2"/>
                                <!-- The Sine Wave (Glowing multi-layer) -->
                                <g>
                                    <path d="M0,150 Q25,50 50,150 T100,150 T150,150 T200,150 T250,150 T300,150 T350,150 T400,150" fill="none" stroke="#06b6d4" stroke-width="12" opacity="0.1"/>
                                    <path d="M0,150 Q25,50 50,150 T100,150 T150,150 T200,150 T250,150 T300,150 T350,150 T400,150" fill="none" stroke="#06b6d4" stroke-width="6" opacity="0.3"/>
                                    <path d="M0,150 Q25,50 50,150 T100,150 T150,150 T200,150 T250,150 T300,150 T350,150 T400,150" fill="none" stroke="#22d3ee" stroke-width="2"/>
                                </g>
                            </svg>
                            
                            <!-- API Metadata Overlay -->
                            <div class="absolute bottom-2 left-2 bg-black/50 backdrop-blur text-[10px] mono text-cyan-500 px-2 py-1 rounded border border-cyan-500/20">
                                GET /api/v1/plot?equation=sin(x)
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // 1. Setup Canvas Drawing (High perf smooth lines)
        const canvas = document.getElementById('smartBoard');
        const ctx = canvas.getContext('2d');
        let isDrawing = false, lastX = 0, lastY = 0;

        // Resize cho nét chữ mượt trên Retina
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * 2;
            canvas.height = rect.height * 2;
            ctx.scale(2,2);
            ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = 4; ctx.strokeStyle = 'white';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            const x = clientX - rect.left; const y = clientY - rect.top;
            
            // Vẽ phát sáng nhẹ
            ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
            ctx.shadowBlur = 10;
            ctx.lineTo(x, y); ctx.stroke();
            lastX = x; lastY = y;
        }

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; ctx.beginPath(); draw(e); });
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', () => { isDrawing = false; ctx.shadowBlur = 0; });
        canvas.addEventListener('mouseout', () => isDrawing = false);

        canvas.addEventListener('touchstart', (e) => { isDrawing = true; ctx.beginPath(); draw(e); });
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', () => isDrawing = false);

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('emptyState').style.opacity = '1';
            document.getElementById('resultContent').classList.remove('active');
        }
        function setTool(tool) {
            // Đơn giản hóa cho Prototype
        }

        // 2. Chức năng Quét AI và Render Đồ thị (Mô phỏng gọi Python Backend)
        function triggerPythonAI() {
            const wrapper = document.getElementById('canvasWrapper');
            const emptyState = document.getElementById('emptyState');
            const resultBox = document.getElementById('resultContent');
            const mathOutput = document.getElementById('mathOutput');
            
            // Bật hiệu ứng quét
            wrapper.classList.add('scanning');
            emptyState.style.opacity = '0';
            resultBox.classList.remove('active');

            // Giả lập Network delay gọi API
            setTimeout(() => {
                wrapper.classList.remove('scanning');
                
                // Trả kết quả LaTeX
                mathOutput.innerHTML = '\\[ y = A \\cdot \\sin(x) \\]';
                MathJax.typesetPromise([mathOutput]).catch(err => console.log(err));

                // Bật khung SVG lên (Hiệu ứng lò xo trượt lên)
                resultBox.classList.add('active');
                
            }, 1500);
        }
    </script>
</body>
</html>
