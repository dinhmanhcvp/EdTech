<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature 6: AI Socratic Companion (Gia sư 1-1)</title>
    <style>
        :root {
            --primary: #8e44ad;
            --bg: #f0f2f5;
            --text: #333;
            --white: #ffffff;
            --user-msg: #3498db;
            --ai-msg: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Khung điện thoại giả lập (Mobile Frame) */
        .mobile-frame {
            width: 400px;
            height: 750px;
            background: var(--white);
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            border: 12px solid #2c3e50;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Tai thỏ iPhone */
        .notch {
            width: 150px;
            height: 25px;
            background: #2c3e50;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            z-index: 10;
        }

        /* Header (App Bar) */
        .app-header {
            background: var(--primary);
            color: white;
            padding: 40px 20px 15px 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 5;
        }

        .level-badge {
            font-size: 0.7em;
            background: rgba(255,255,255,0.2);
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: normal;
        }

        /* Khu vực Chat */
        .chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #f8f9fc;
        }

        .msg-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95em;
            line-height: 1.4;
            animation: popIn 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        .user-msg {
            background: var(--user-msg);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-msg {
            background: var(--ai-msg);
            color: var(--text);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #e0e0e0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        /* Visual Debugging - Bảng trực quan hóa Hóa học */
        .visual-scale {
            background: #eef2f5;
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
            text-align: center;
            font-family: monospace;
            font-size: 1.1em;
            border: 2px dashed #bdc3c7;
        }

        /* Input Area */
        .input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .camera-btn {
            background: #f1f2f6;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2em;
            cursor: pointer;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .camera-btn:hover {
            background: #e1e2e6;
        }

        .input-box {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 10px 15px;
            outline: none;
            font-family: inherit;
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes popIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Nút kịch bản Demo */
        .demo-panel {
            margin-left: 30px;
            max-width: 400px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .demo-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: #34495e;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
        }

        .demo-btn:hover { background: #2c3e50; }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: var(--ai-msg);
            padding: 10px 15px;
            border-radius: 18px;
            border: 1px solid #e0e0e0;
            color: #7f8c8d;
            font-style: italic;
            font-size: 0.8em;
            margin-bottom: 15px;
        }
    </style>
    <!-- MathJax -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

    <!-- Giao diện Mobile App cho học sinh -->
    <div class="mobile-frame">
        <div class="notch"></div>
        <div class="app-header">
            <span>🎓 Socratic Tutor</span>
            <span class="level-badge">Toán/Lý/Hóa</span>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="msg-bubble ai-msg" style="animation-delay: 0.1s;">
                Chào em! Trợ lý Socratic đã sẵn sàng. Hôm nay em gặp khó khăn ở môn KHTN nào?
            </div>
            <!-- Nơi chứa nội dung chat -->
            <div class="typing-indicator" id="typing">AI đang gõ...</div>
        </div>

        <div class="input-area">
            <button class="camera-btn">📷</button>
            <input type="text" class="input-box" placeholder="Nhập câu hỏi hoặc chụp ảnh..." disabled>
            <button class="send-btn">➤</button>
        </div>
    </div>

    <!-- Bảng điều khiển Demo (Dành cho việc quay video) -->
    <div class="demo-panel">
        <h2 style="color: #8e44ad; margin-top: 0;">Feature 6: Gia sư 1-1</h2>
        <p>Tính năng chống gian lận (Scaffolding). AI không bao giờ giải bài ngay mà sẽ đặt câu hỏi gợi mở, kèm theo trực quan hóa hình ảnh.</p>
        
        <h3 style="font-size: 1em; border-bottom: 1px solid #ccc; padding-bottom: 5px;">Mô phỏng Kịch bản:</h3>
        <button class="demo-btn" onclick="playScenario(1)">Bước 1: Học sinh hỏi bài Hóa học</button>
        <button class="demo-btn" onclick="playScenario(2)">Bước 2: AI áp dụng "Scaffolding"</button>
        <button class="demo-btn" onclick="playScenario(3)">Bước 3: Học sinh trả lời sai</button>
        <button class="demo-btn" onclick="playScenario(4)">Bước 4: Trực quan hóa (Visual Debugging)</button>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const typingIndicator = document.getElementById('typing');

        function appendMessage(sender, htmlContent, delay = 0) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    const div = document.createElement('div');
                    div.className = `msg-bubble ${sender}-msg`;
                    div.innerHTML = htmlContent;
                    
                    // Chèn tin nhắn mới ngay trên cái indicator (typing)
                    chatArea.insertBefore(div, typingIndicator);
                    
                    // Cuộn xuống cuối
                    chatArea.scrollTop = chatArea.scrollHeight;
                    
                    // Render MathJax nếu có công thức
                    MathJax.typesetPromise([div]).catch((err) => console.log(err.message));
                    
                    resolve();
                }, delay);
            });
        }

        async function playScenario(step) {
            if (step === 1) {
                await appendMessage('user', 'Giáo viên bắt cân bằng phương trình này: \\( Fe + O_2 \\rightarrow Fe_2O_3 \\). Giúp em với, kết quả ra bao nhiêu ạ?');
            }
            else if (step === 2) {
                typingIndicator.style.display = 'block';
                await appendMessage('ai', 'Cô thấy rồi nhé! Cô sẽ không đọc đáp án ngay đâu. Theo định luật bảo toàn khối lượng, số nguyên tử mỗi nguyên tố ở hai bên mũi tên phải bằng nhau. <br><br>Em thử đếm số nguyên tử Oxy bên phải mũi tên (Fe₂O₃) xem là mấy?', 1500);
                typingIndicator.style.display = 'none';
            }
            else if (step === 3) {
                await appendMessage('user', 'Dạ là 2 ạ?');
            }
            else if (step === 4) {
                typingIndicator.style.display = 'block';
                const visualHtml = `
                    Gần đúng rồi! Hãy nhìn chỉ số dưới chân nhé. Em quan sát "Cái cân" ảo dưới đây:
                    <div class="visual-scale">
                        [ O O ] &nbsp; ⚖️ &nbsp; [ O O O ]<br>
                        (Trái) &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; (Phải)
                    </div>
                    Cái cân đang nghiêng về bên phải vì có tới 3 Oxy. Trong khi bên trái chỉ có cụm \\( O_2 \\) (2 Oxy). <br><br>Để làm cân bằng 2 và 3, ta sẽ tìm bội chung nhỏ nhất là 6. Vậy em cần điền hệ số mấy trước \\( O_2 \\) và \\( Fe_2O_3 \\)?
                `;
                await appendMessage('ai', visualHtml, 1500);
                typingIndicator.style.display = 'none';
            }
        }
    </script>
</body>
</html>
